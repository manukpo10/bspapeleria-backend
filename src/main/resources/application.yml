spring:
  application:
    name: bspapeleria-backend
  datasource:
    url: jdbc:postgresql://db.kpnukedjelyfoewpqwpr.supabase.co:5432/postgres?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:bspapeleria-jwt-secret-2024-production-key-very-long-32chars}
    expiration: ${JWT_EXPIRATION:86400000}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  public-key: ${MP_PUBLIC_KEY:}
  sandbox: ${MP_SANDBOX:true}

# CORS
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      allowed: "*"