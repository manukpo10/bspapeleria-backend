spring:
  application:
    name: bspapeleria-backend
  datasource:
    url: jdbc:h2:mem:bspapeleria;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

app:
  jwt:
    secret: BS Papeleria Secret Key Para JWT 2024 - Minimum 256 bits needed
    expiration: 86400000

mercadopago:
  access-token: TEST-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  public-key: TEST-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  sandbox: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000