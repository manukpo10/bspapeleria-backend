spring:
  application:
    name: bspapeleria-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bspapeleria}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:BS Papeleria Secret Key Para JWT 2024 - Minimum 256 bits needed}
    expiration: ${JWT_EXPIRATION:86400000}

mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}
  public-key: ${MP_PUBLIC_KEY:}
  sandbox: ${MP_SANDBOX:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}